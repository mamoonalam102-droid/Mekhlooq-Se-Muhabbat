<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mekhlooq Se Muhabbat - Cloud Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b251c; color: #eaf2ef; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; margin: 0 auto; }
    
    /* Lock Screen */
    .lock-screen { background: #113326; border: 1px solid #1e4d3a; border-radius: 16px; padding: 32px 20px; text-align: center; margin-top: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .lock-screen h1 { color: #e5c158; font-size: 20px; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
    .lock-screen p { color: #a3c2b5; font-size: 13px; margin-bottom: 24px; }
    .input-wrapper { position: relative; margin-bottom: 16px; }
    .input-wrapper input { width: 100%; padding: 14px 42px 14px 16px; background: #081d15; border: 1px solid #235843; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
    .input-wrapper input:focus { border-color: #e5c158; }
    .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #a3c2b5; cursor: pointer; font-size: 18px; padding: 4px; }
    .btn-gold { width: 100%; padding: 14px; background: #e5c158; border: none; border-radius: 10px; color: #0b251c; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }

    /* Dashboard */
    .dashboard { display: none; }
    .header-banner { text-align: center; margin-bottom: 16px; padding: 10px 0; }
    .urdu-poetry { font-family: 'Amiri', serif; font-size: 24px; color: #e5c158; line-height: 1.5; }
    .card { background: #113326; border: 1px solid #1e4d3a; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .sum-box { background: #081d15; border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid #1b4535; }
    .sum-box label { font-size: 10px; color: #a3c2b5; font-weight: 700; display: block; margin-bottom: 4px; text-transform: uppercase; }
    .sum-box span { font-size: 13px; font-weight: 700; }
    .sum-box.collected span { color: #52c41a; }
    .sum-box.spent span { color: #ff4d4f; }
    .sum-box.balance span { color: #e5c158; }

    .form-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 12px; }
    .type-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; background: #081d15; border: 1px solid #235843; border-radius: 8px; color: #a3c2b5; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
    .tab-btn.active-collection { background: #1a4d36; border-color: #52c41a; color: #52c41a; }
    .tab-btn.active-expense { background: #4d1a1a; border-color: #ff4d4f; color: #ff4d4f; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #a3c2b5; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; background: #081d15; border: 1px solid #235843; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none; }
    .file-input { width: 100%; padding: 8px; background: #081d15; border: 1px solid #235843; border-radius: 8px; color: #a3c2b5; font-size: 13px; cursor: pointer; }
    
    .pay-mode-btns { display: flex; gap: 8px; }
    .pay-mode-btn { flex: 1; padding: 8px; background: #081d15; border: 1px solid #235843; border-radius: 8px; color: #a3c2b5; font-size: 12px; cursor: pointer; text-align: center; }
    .pay-mode-btn.active { border-color: #e5c158; color: #e5c158; background: #1d3d30; font-weight: 600; }

    .entry-card { background: #081d15; border: 1px solid #1b4535; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .entry-info h4 { font-size: 14px; color: #fff; margin-bottom: 2px; }
    .entry-info p { font-size: 11px; color: #a3c2b5; }
    .entry-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-top: 4px; background: #e5c158; color: #0b251c; }
    .receipt-link { display: inline-block; margin-top: 6px; color: #e5c158; font-size: 12px; text-decoration: underline; font-weight: 600; }
    .entry-amount { text-align: right; }
    .entry-amount .val { font-size: 15px; font-weight: 700; }
    .entry-amount .val.plus { color: #52c41a; }
    .entry-amount .val.minus { color: #ff4d4f; }
    .status-msg { text-align: center; color: #e5c158; font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- LOCK SCREEN -->
  <div id="lockScreen" class="lock-screen">
    <h1>Mekhlooq Se Muhabbat</h1>
    <p>Enter passcode to access cloud ledger</p>
    <div class="input-wrapper">
      <input type="password" id="passcode" placeholder="Passcode" autocomplete="off">
      <button type="button" class="eye-btn" onclick="togglePassVisibility(event)">👁️</button>
    </div>
    <button type="button" class="btn-gold" onclick="unlockLedger()">Unlock Ledger</button>
    <div id="errorMsg" class="error-msg">Incorrect passcode</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">
    <div class="header-banner">
      <div class="urdu-poetry">اس راہ کے مسافر ہیں، اسی راہ میں ملیں گے</div>
    </div>

    <!-- SUMMARY -->
    <div class="card">
      <div class="summary-grid">
        <div class="sum-box collected">
          <label>Collected</label>
          <span id="sumCollected">Rs. 0</span>
        </div>
        <div class="sum-box spent">
          <label>Spent</label>
          <span id="sumSpent">Rs. 0</span>
        </div>
        <div class="sum-box balance">
          <label>Net Balance</label>
          <span id="sumBalance">Rs. 0</span>
        </div>
      </div>
    </div>

    <!-- LOG NEW ENTRY -->
    <div class="card">
      <div class="form-title">Log New Entry</div>
      <div class="type-tabs">
        <div id="tabCollection" class="tab-btn active-collection" onclick="setEntryType('collection')">+ Collection</div>
        <div id="tabExpense" class="tab-btn" onclick="setEntryType('expense')">- Expense</div>
      </div>

      <form id="entryForm" onsubmit="saveEntry(event)">
        <div class="form-group">
          <label id="nameLabel">Donor / Supporter Name *</label>
          <input type="text" id="donorName" required placeholder="e.g., Brother Ali">
        </div>

        <div class="form-group">
          <label>Amount (PKR) *</label>
          <input type="number" id="amount" required placeholder="0">
        </div>

        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="entryDate" required>
        </div>

        <div class="form-group">
          <div class="pay-mode-btns">
            <div id="modeOnline" class="pay-mode-btn active" onclick="setPayMode('Online Transfer')">Online Transfer</div>
            <div id="modeCash" class="pay-mode-btn" onclick="setPayMode('Cash In Hand')">Cash In Hand</div>
          </div>
        </div>

        <div class="form-group">
          <label>Handled / Received By</label>
          <input type="text" id="handledBy" placeholder="e.g., Volunteer name">
        </div>

        <div class="form-group">
          <label>Note</label>
          <textarea id="noteText" rows="2" placeholder="Additional details..."></textarea>
        </div>

        <div class="form-group">
          <label>Attach Screenshot / Receipt (Optional)</label>
          <input type="file" id="receiptImg" class="file-input" accept="image/*">
        </div>

        <button type="submit" id="saveBtn" class="btn-gold">Save Entry to Cloud</button>
        <div id="statusMsg" class="status-msg">Saving entry & uploading image to Drive...</div>
      </form>
    </div>

    <!-- DRIVE STREAM -->
    <div class="card">
      <div class="form-title">Drive Stream (Cloud Synced)</div>
      <div id="entriesList">Loading records...</div>
    </div>

  </div>

</div>

<script>
  const CLOUD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWlGiiPu7XvBKO9xWu_5fWVzBSBhRJEtBllA9_oqVHa1b9QUJzRfu-llg4-bS8D_KW/exec";

  let currentType = 'collection';
  let currentPayMode = 'Online Transfer';

  document.getElementById('entryDate').valueAsDate = new Date();

  if (localStorage.getItem('isUnlocked') === 'true') {
    showDashboard();
  }

  function togglePassVisibility(e) {
    if (e) e.preventDefault();
    const input = document.getElementById('passcode');
    const val = input.value;
    input.type = input.type === 'password' ? 'text' : 'password';
    input.value = val;
  }

  function unlockLedger() {
    const val = document.getElementById('passcode').value.trim().toLowerCase();
    if (val === 'langarkahissa') {
      localStorage.setItem('isUnlocked', 'true');
      showDashboard();
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  }

  function showDashboard() {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    fetchCloudEntries();
  }

  function setEntryType(type) {
    currentType = type;
    document.getElementById('tabCollection').className = 'tab-btn ' + (type === 'collection' ? 'active-collection' : '');
    document.getElementById('tabExpense').className = 'tab-btn ' + (type === 'expense' ? 'active-expense' : '');
    document.getElementById('saveBtn').innerText = type === 'collection' ? 'Save Collection to Cloud' : 'Save Expense to Cloud';
    document.getElementById('nameLabel').innerText = type === 'collection' ? 'Donor / Supporter Name *' : 'Expense Title / Detail *';
  }

  function setPayMode(mode) {
    currentPayMode = mode;
    document.getElementById('modeOnline').className = 'pay-mode-btn ' + (mode === 'Online Transfer' ? 'active' : '');
    document.getElementById('modeCash').className = 'pay-mode-btn ' + (mode === 'Cash In Hand' ? 'active' : '');
  }

  async function fetchCloudEntries() {
    const container = document.getElementById('entriesList');
    container.innerHTML = '<div style="text-align:center; color:#e5c158; padding:12px;">Syncing with Cloud...</div>';

    try {
      // Added Cache-Buster (?t=...) to always fetch real-time fresh data
      const response = await fetch(CLOUD_SCRIPT_URL + "?t=" + Date.now());
      const data = await response.json();
      renderEntries(data.reverse());
    } catch(err) {
      container.innerHTML = '<div style="text-align:center; color:#ff4d4f; padding:12px;">Failed to load data. Check internet connection.</div>';
    }
  }

  async function saveEntry(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');

    saveBtn.disabled = true;
    statusMsg.style.display = 'block';

    const fileInput = document.getElementById('receiptImg');
    let imageBase64 = null;
    let fileName = null;
    let mimeType = null;

    if (fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      fileName = file.name;
      mimeType = file.type;
      imageBase64 = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    const payload = {
      action: "add",
      id: Date.now(),
      type: currentType,
      name: document.getElementById('donorName').value,
      amount: parseFloat(document.getElementById('amount').value),
      date: document.getElementById('entryDate').value,
      mode: currentPayMode,
      handledBy: document.getElementById('handledBy').value,
      note: document.getElementById('noteText').value,
      image: imageBase64,
      filename: fileName,
      mimeType: mimeType
    };

    try {
      await fetch(CLOUD_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      document.getElementById('entryForm').reset();
      document.getElementById('entryDate').valueAsDate = new Date();
      statusMsg.style.display = 'none';
      saveBtn.disabled = false;
      
      // Wait 1.5 seconds then refresh list to allow sheet processing
      setTimeout(fetchCloudEntries, 1500);
    } catch(err) {
      alert("Error saving data. Please try again.");
      statusMsg.style.display = 'none';
      saveBtn.disabled = false;
    }
  }

  function renderEntries(entries) {
    const container = document.getElementById('entriesList');
    container.innerHTML = '';

    let totalCol = 0;
    let totalExp = 0;

    if (!entries || entries.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#a3c2b5; font-size:13px; padding:16px;">No entries logged yet.</div>';
    } else {
      entries.forEach(item => {
        const amt = parseFloat(item.amount) || 0;
        if (item.type === 'collection') totalCol += amt;
        else totalExp += amt;

        let imageHTML = '';
        if (item.image && item.image.startsWith('http')) {
          imageHTML = `<br><a href="${item.image}" target="_blank" class="receipt-link">📷 View Screenshot</a>`;
        }

        const card = document.createElement('div');
        card.className = 'entry-card';
        card.innerHTML = `
          <div class="entry-info">
            <h4>${item.name}</h4>
            <p>${item.date} • ${item.mode} ${item.handledBy ? '• By: ' + item.handledBy : ''}</p>
            <span class="entry-badge">${String(item.type).toUpperCase()}</span>
            ${imageHTML}
          </div>
          <div class="entry-amount">
            <div class="val ${item.type === 'collection' ? 'plus' : 'minus'}">
              ${item.type === 'collection' ? '+' : '-'}Rs. ${amt.toLocaleString()}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('sumCollected').innerText = `Rs. ${totalCol.toLocaleString()}`;
    document.getElementById('sumSpent').innerText = `Rs. ${totalExp.toLocaleString()}`;
    document.getElementById('sumBalance').innerText = `Rs. ${(totalCol - totalExp).toLocaleString()}`;
  }
</script>

</body>
</html>
